name: Refresh lockfile

# Run manually (Actions → Refresh lockfile → Run workflow) to resolve
# package.json and commit an up-to-date package-lock.json to the chosen branch.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Resolve dependencies
        run: |
          rm -f package-lock.json
          npm install --package-lock-only --no-audit --no-fund

      - name: Commit lockfile
        run: |
          if git diff --quiet --exit-code -- package-lock.json && git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            echo "Lockfile unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: refresh package-lock.json"
          git push
